services:
    haproxy:
        build:
            context: ./haproxy
            dockerfile: Dockerfile
        container_name: haproxy
        hostname: haproxy
        depends_on:
            - rabbitmq1
            - rabbitmq2
            - rabbitmq3
            - rabbitmq4
            - rabbitmq5
        ports:
            - "1936:1936"
            - "5672:5672"
            - "15672:15672"
        environment:
            FRONTEND_PORT : 5672
            BACKENDS: "rabbitmq1:5672 rabbitmq2:5672 rabbitmq3:5672 rabbitmq4:5672 rabbitmq5:5672"
            DNS_ENABLED: "true"
            LOG_LEVEL: "info"

    rabbitmq1:
        build:
            context: ./rabbitmq
            dockerfile: Dockerfile
        container_name: rabbitmq1
        hostname: rabbitmq1
        environment:
            RABBITMQ_ERLANG_COOKIE: cookie
            RABBITMQ_DEFAULT_USER: admin
            RABBITMQ_DEFAULT_PASS: admin
        ports:
            - 15673:15672

    rabbitmq2:
